<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS App Icon 生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #e94560, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            text-align: center;
            color: #8892b0;
            margin-bottom: 40px;
        }
        .upload-area {
            border: 3px dashed #e94560;
            border-radius: 20px;
            padding: 60px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(233, 69, 96, 0.05);
            margin-bottom: 30px;
        }
        .upload-area:hover {
            background: rgba(233, 69, 96, 0.15);
            border-color: #ff6b9d;
        }
        .upload-area.dragover {
            background: rgba(233, 69, 96, 0.2);
            transform: scale(1.02);
        }
        .upload-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .upload-text {
            font-size: 1.2rem;
            color: #ccd6f6;
        }
        .upload-hint {
            color: #8892b0;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        #fileInput {
            display: none;
        }
        .preview-section {
            display: none;
            margin-bottom: 30px;
        }
        .preview-section.active {
            display: block;
        }
        .preview-container {
            display: flex;
            align-items: center;
            gap: 30px;
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        #preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .preview-info {
            flex: 1;
        }
        .preview-info h3 {
            color: #e94560;
            margin-bottom: 10px;
        }
        .preview-info p {
            color: #8892b0;
            margin: 5px 0;
        }
        .btn {
            background: linear-gradient(135deg, #e94560, #ff6b9d);
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-container {
            text-align: center;
            margin: 30px 0;
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .icon-item {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .icon-item:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-5px);
        }
        .icon-item img {
            border-radius: 12px;
            margin-bottom: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }
        .icon-item .name {
            font-size: 0.75rem;
            color: #ccd6f6;
            word-break: break-all;
        }
        .icon-item .size {
            font-size: 0.7rem;
            color: #8892b0;
            margin-top: 5px;
        }
        .download-link {
            display: inline-block;
            margin-top: 8px;
            color: #e94560;
            text-decoration: none;
            font-size: 0.75rem;
        }
        .download-link:hover {
            text-decoration: underline;
        }
        .progress {
            display: none;
            text-align: center;
            padding: 20px;
            color: #8892b0;
        }
        .progress.active {
            display: block;
        }
        .section-title {
            font-size: 1.3rem;
            color: #ccd6f6;
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 iOS App Icon 生成器</h1>
        <p class="subtitle">选择一张 1024x1024 的 PNG 图片，自动生成所有 iOS 图标尺寸</p>
        
        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📱</div>
            <div class="upload-text">点击选择图片 或 拖拽图片到这里</div>
            <div class="upload-hint">建议使用 1024x1024 像素的 PNG 图片</div>
        </div>
        <input type="file" id="fileInput" accept="image/png,image/jpeg">
        
        <div class="preview-section" id="previewSection">
            <div class="preview-container">
                <img id="preview" src="" alt="预览">
                <div class="preview-info">
                    <h3>原始图片</h3>
                    <p id="fileName">文件名：-</p>
                    <p id="fileSize">尺寸：-</p>
                </div>
            </div>
            
            <div class="btn-container">
                <button class="btn" id="generateBtn">🚀 生成所有图标</button>
            </div>
        </div>
        
        <div class="progress" id="progress">
            ⏳ 正在生成图标...
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        // iOS App Icon 所需尺寸配置
        const iconConfigs = [
            // iPhone
            { name: 'icon-20@2x', size: 40, desc: 'iPhone Notification @2x' },
            { name: 'icon-20@3x', size: 60, desc: 'iPhone Notification @3x' },
            { name: 'icon-29@2x', size: 58, desc: 'iPhone Settings @2x' },
            { name: 'icon-29@3x', size: 87, desc: 'iPhone Settings @3x' },
            { name: 'icon-40@2x', size: 80, desc: 'iPhone Spotlight @2x' },
            { name: 'icon-40@3x', size: 120, desc: 'iPhone Spotlight @3x' },
            { name: 'icon-60@2x', size: 120, desc: 'iPhone App @2x' },
            { name: 'icon-60@3x', size: 180, desc: 'iPhone App @3x' },
            // iPad
            { name: 'icon-20@1x', size: 20, desc: 'iPad Notification @1x' },
            { name: 'icon-20@2x-ipad', size: 40, desc: 'iPad Notification @2x' },
            { name: 'icon-29@1x', size: 29, desc: 'iPad Settings @1x' },
            { name: 'icon-29@2x-ipad', size: 58, desc: 'iPad Settings @2x' },
            { name: 'icon-40@1x', size: 40, desc: 'iPad Spotlight @1x' },
            { name: 'icon-40@2x-ipad', size: 80, desc: 'iPad Spotlight @2x' },
            { name: 'icon-76@2x', size: 152, desc: 'iPad App @2x' },
            { name: 'icon-83.5@2x', size: 167, desc: 'iPad Pro App @2x' },
            // App Store
            { name: '1024', size: 1024, desc: 'App Store' },
        ];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const preview = document.getElementById('preview');
        const generateBtn = document.getElementById('generateBtn');
        const progress = document.getElementById('progress');
        const result = document.getElementById('result');

        let originalImage = null;

        // 点击上传区域
        uploadArea.addEventListener('click', () => fileInput.click());

        // 拖拽效果
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    preview.src = e.target.result;
                    document.getElementById('fileName').textContent = `文件名：${file.name}`;
                    document.getElementById('fileSize').textContent = `尺寸：${img.width} × ${img.height} 像素`;
                    previewSection.classList.add('active');
                    result.innerHTML = '';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 生成图标
        generateBtn.addEventListener('click', async () => {
            if (!originalImage) return;

            generateBtn.disabled = true;
            progress.classList.add('active');
            result.innerHTML = '';

            await new Promise(resolve => setTimeout(resolve, 100));

            let html = '<h2 class="section-title">📦 生成的图标 (点击下载)</h2><div class="icons-grid">';

            for (const config of iconConfigs) {
                const canvas = document.createElement('canvas');
                canvas.width = config.size;
                canvas.height = config.size;
                const ctx = canvas.getContext('2d');
                
                // 使用高质量缩放
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(originalImage, 0, 0, config.size, config.size);

                const dataUrl = canvas.toDataURL('image/png');
                const fileName = `${config.name}.png`;

                html += `
                    <div class="icon-item">
                        <img src="${dataUrl}" width="${Math.min(config.size, 80)}" height="${Math.min(config.size, 80)}">
                        <div class="name">${fileName}</div>
                        <div class="size">${config.size}×${config.size}px</div>
                        <a class="download-link" href="${dataUrl}" download="${fileName}">⬇️ 下载</a>
                    </div>
                `;
            }

            html += '</div>';
            
            // 添加批量下载按钮
            html += `
                <div class="btn-container" style="margin-top: 40px;">
                    <button class="btn" onclick="downloadAll()">📥 批量下载所有图标 (ZIP)</button>
                </div>
            `;

            result.innerHTML = html;
            progress.classList.remove('active');
            generateBtn.disabled = false;
        });

        // 批量下载（简单版：逐个下载）
        async function downloadAll() {
            const links = document.querySelectorAll('.download-link');
            for (let i = 0; i < links.length; i++) {
                links[i].click();
                await new Promise(resolve => setTimeout(resolve, 200));
            }
        }
    </script>
</body>
</html>
